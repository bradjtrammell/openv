name: OpenV Windows client build (experimental)
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/openv-windows-client.yml'
      - 'tools/openv-gaming-pc-preflight.ps1'
      - 'tools/build_openv_ui.py'
      - 'tools/audit_openv_runtime.py'
      - 'tools/stage_msvc_runtime.py'
      - 'tools/stage_cef_runtime.py'
      - 'tests/test_stage_msvc_runtime.py'
      - 'tests/test_stage_cef_runtime.py'
      - 'ext/ui-build/**'
      - 'tests/test_openv_ui.py'
      - 'tests/test_openv_runtime_audit.py'
concurrency:
  group: openv-windows-client-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  client:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1
      - name: Initialize required submodules with progress
        shell: bash
        timeout-minutes: 75
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git config --global core.longpaths true
          git config --global submodule.fetchJobs 8
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth 1 --jobs 8 --progress
          git submodule status --recursive > submodule-status.txt
      - name: Prepare toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Windows toolchain inventory'
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'Visual Studio discovery tool not found' }
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\\**\\Bin\\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'Visual Studio MSBuild workload not found' }
          Write-Host "MSBuild: $msbuild"
          where.exe node
          where.exe python
          where.exe git
          where.exe bash
          if (-not (Test-Path 'C:\msys64')) { throw 'MSYS2 required at C:\msys64 (see docs/building.md)' }
          if (-not (Get-Command yarn -ErrorAction SilentlyContinue)) { corepack enable; corepack prepare yarn@1.22.22 --activate }
      - name: Install Python build prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade 'setuptools>=70,<82' wheel
          python -c "import distutils; print('distutils available:', distutils.__file__)"
      - name: Verify first-party root and fallback JavaScript syntax
        run: |
          node --check ext/ui-build/data/root.js
          if ($LASTEXITCODE -ne 0) { throw 'OpenV native root JavaScript failed syntax check' }
          node --check ext/ui-build/loadscreen-fallback/code.js
          if ($LASTEXITCODE -ne 0) { throw 'OpenV source-only loadscreen JavaScript failed syntax check' }
      - name: Test first-party UI packager
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tests -p test_openv_ui.py -v
          if ($LASTEXITCODE -ne 0) { throw 'OpenV UI packaging tests failed' }
      - name: Test Windows PE/runtime audit
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tests -p test_openv_runtime_audit.py -v
          if ($LASTEXITCODE -ne 0) { throw 'OpenV Windows runtime audit tests failed' }
      - name: Test VC143 redistributable staging
        run: |
          python -m unittest discover -s tests -p test_stage_msvc_runtime.py -v
          if ($LASTEXITCODE -ne 0) { throw 'VC143 staging security tests failed' }
      - name: Test pinned CEF staging, license and rollback safety
        run: |
          python -m unittest discover -s tests -p test_stage_cef_runtime.py -v
          if ($LASTEXITCODE -ne 0) { throw 'CEF runtime staging tests failed' }
      - name: Select installed Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          if (-not (Test-Path $sdkRoot)) { throw 'Windows SDK include directory unavailable' }
          $sdk = Get-ChildItem $sdkRoot -Directory |
            Where-Object { (Test-Path (Join-Path $_.FullName 'um\Windows.h')) -and ($_.Name -match '^10[.]0[.][0-9]+[.]0$') } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $sdk) { throw 'No usable Windows SDK found' }
          "WINDOWS_SDK_VERSION=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using Windows SDK: $($sdk.Name)"
      - name: Build client using documented toolchain
        id: build
        continue-on-error: true
        shell: bash
        env:
          PROGRAM: five
        run: |
          set -euo pipefail
          pwsh ./fxd.ps1 get-chrome
          ./prebuild.cmd
          pwsh ./fxd.ps1 gen -game five
          MSBUILD="/c/Program Files/Microsoft Visual Studio/2022/Enterprise/MSBuild/Current/Bin/MSBuild.exe"
          [[ -f "$MSBUILD" ]] || MSBUILD="/c/Program Files/Microsoft Visual Studio/2022/Community/MSBuild/Current/Bin/MSBuild.exe"
          [[ -f "$MSBUILD" ]] || { echo "Could not locate MSBuild"; exit 1; }
          cd code/build/five
          "$MSBUILD" CitizenMP.sln -t:build -restore -p:RestorePackagesConfig=true -p:preferredtoolarchitecture=x64 -p:configuration=release -p:WindowsTargetPlatformVersion=$WINDOWS_SDK_VERSION -maxcpucount:4 -v:minimal -fl1 '-flp1:logfile=client-msbuild.log;errorsonly'
      - name: Build and stage first-party OpenV UI
        id: ui
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmd.exe /d /c 'ext\ui-build\build.cmd five'
          if ($LASTEXITCODE -ne 0) { throw 'OpenV UI source build failed' }
          $destination = 'code/bin/five/release/citizen'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -LiteralPath 'ext/ui-build/data.zip' -Destination "$destination/ui.zip" -Force
          Copy-Item -LiteralPath 'ext/ui-build/data_big.zip' -Destination "$destination/ui-big.zip" -Force
          python tools/build_openv_ui.py --verify-runtime code/bin/five/release
          if ($LASTEXITCODE -ne 0) { throw 'Staged OpenV UI failed archive verification' }
          New-Item -ItemType Directory -Force -Path build-report | Out-Null
          Copy-Item -LiteralPath 'ext/ui-build/openv-ui-manifest.json' -Destination 'build-report/openv-ui-manifest.json' -Force
      - name: Stage signed installed VC143 x64 redistributable
        id: msvc
        if: steps.build.outcome == 'success' && steps.ui.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build-report | Out-Null
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -property installationPath | Select-Object -First 1
          if (-not $installation) { throw 'Visual Studio installation not found for VC143 redistributable' }
          $redist = Join-Path $installation 'VC\Redist\MSVC'
          python tools/stage_msvc_runtime.py --redist-root $redist --runtime code/bin/five/release --report build-report/msvc-runtime-provenance.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed Microsoft-signed VC143 x64 runtime staging failed' }
      - name: Stage pinned, existing CEF runtime and license
        id: cef
        if: steps.build.outcome == 'success' && steps.ui.outcome == 'success' && steps.msvc.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/stage_cef_runtime.py --source vendor/cef --runtime code/bin/five/release --report build-report/cef-runtime-provenance.json
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CEF runtime staging failed; inspect CEF provenance report' }
      - name: Collect build files and provenance
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path build-report | Out-Null
          git rev-parse HEAD | Set-Content build-report/commit.txt
          Copy-Item submodule-status.txt build-report/submodule-status.txt -ErrorAction SilentlyContinue
          Get-ChildItem -Path code/bin/five -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object FullName,Length | Export-Csv build-report/files.csv -NoTypeInformation
          Copy-Item code/build/five/client-msbuild.log build-report/client-msbuild.log -ErrorAction SilentlyContinue
          Get-ChildItem -Path code/bin/five/release -ErrorAction SilentlyContinue |
            Out-String | Set-Content build-report/release-directory.txt
      - name: Inventory experimental package
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'code/bin/five/release'
          if (-not (Test-Path $root)) {
            '{"status":"missing_release_directory"}' | Set-Content build-report/package-manifest.json
            exit 0
          }
          $resolved = (Resolve-Path $root).Path
          $files = @(Get-ChildItem $resolved -File -Recurse | ForEach-Object {
            $relative = $_.FullName.Substring($resolved.Length).TrimStart('\','/')
            [pscustomobject]@{
              path = $relative.Replace('\','/')
              bytes = $_.Length
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            }
          })
          $executables = @($files | Where-Object { $_.path -match '(?i)[.]exe$' } | Select-Object -ExpandProperty path)
          $manifest = [pscustomobject]@{
            source_commit = (git rev-parse HEAD)
            artifact_root = $root
            file_count = $files.Count
            total_bytes = ($files | Measure-Object -Property bytes -Sum).Sum
            executables = $executables
            files = $files
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 build-report/package-manifest.json
          Write-Host "Package: $($files.Count) files; $($executables.Count) EXE files"
          $executables | ForEach-Object { Write-Host "Executable: $_" }
      - name: Assess runtime readiness
        if: always()
        shell: pwsh
        run: |
          $root = 'code/bin/five/release'
          $uiReady = $false
          if (Test-Path (Join-Path $root 'citizen/ui.zip')) {
            python tools/build_openv_ui.py --verify-runtime $root
            $uiReady = ($LASTEXITCODE -eq 0)
          }
          $checks = [ordered]@{
            compiled_executable = (Test-Path (Join-Path $root 'FiveM.exe') -PathType Leaf)
            legitimacy_component = (Test-Path (Join-Path $root 'legitimacy.dll') -PathType Leaf)
            client_ui = $uiReady
            chrome_subprocess = (Test-Path (Join-Path $root 'CitizenFX_SubProcess_chrome.bin') -PathType Leaf)
          }
          $result = [ordered]@{
            source_commit = (git rev-parse HEAD)
            status = $(if ($checks.Values -contains $false) {'incomplete'} else {'preliminary_inventory_pass'})
            note = 'Inventory only; game launch, entitlements, authorized distribution and multiplayer have not been tested.'
            checks = $checks
          }
          $result | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 build-report/runtime-readiness.json
          $checks.GetEnumerator() | ForEach-Object { Write-Host "$($_.Key): $($_.Value)" }
      - name: Audit Windows runtime binaries, dependencies and UI
        id: runtime_audit
        if: steps.build.outcome == 'success' && steps.ui.outcome == 'success' && steps.msvc.outcome == 'success' && steps.cef.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/audit_openv_runtime.py --runtime code/bin/five/release --report build-report/runtime-static-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'OpenV runtime static audit failed; inspect runtime-static-audit.json for missing DLLs, invalid PE files or UI bundles.' }
      - name: Stage runtime-only files
        id: stage
        if: steps.build.outcome == 'success' && steps.ui.outcome == 'success' && steps.runtime_audit.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path 'code/bin/five/release').Path
          $destination = Join-Path (Get-Location) 'openv-test-runtime'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $files = @(Get-ChildItem $source -File -Recurse | Where-Object {
            $_.Extension -notin @('.pdb','.exp','.lib','.ilk','.ipch','.iobj','.ipdb') -and
            $_.FullName.Substring($source.Length).TrimStart('\','/') -notmatch '^(dbg[\\/])'
          })
          foreach ($file in $files) {
            $relative = $file.FullName.Substring($source.Length).TrimStart('\','/')
            $target = Join-Path $destination $relative
            New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $target
          }
          Write-Host "Staged $($files.Count) runtime files (no compiled debug symbols)."
      - name: Verify staged runtime bytes against audited source
        id: stage_audit
        if: steps.stage.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/audit_openv_runtime.py --runtime openv-test-runtime --baseline-report build-report/runtime-static-audit.json --report build-report/staged-runtime-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Staged runtime is incomplete or differs from audited source; inspect staged-runtime-audit.json.' }
      - name: Upload lean runtime candidate
        if: steps.build.outcome == 'success' && steps.ui.outcome == 'success' && steps.runtime_audit.outcome == 'success' && steps.stage_audit.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: openv-win-runtime-candidate
          path: openv-test-runtime/
          if-no-files-found: error
          retention-days: 7
      - name: Inventory generated UI bundles
        if: always()
        shell: pwsh
        run: |
          $paths = @('ext/ui-build/data.zip','ext/ui-build/data_big.zip','code/bin/five/release/citizen/ui.zip','code/bin/five/release/citizen/ui-big.zip')
          $items = foreach ($path in $paths) {
            $present = Test-Path -LiteralPath $path
            $item = if ($present) { Get-Item -LiteralPath $path } else { $null }
            [pscustomobject]@{ path=$path; present=$present; bytes=$(if ($item -and -not $item.PSIsContainer) { $item.Length } else { $null }) }
          }
          @{ note='Source-built first-party UI bundles. Runtime ZIP content is checked by tools/build_openv_ui.py.'; items=@($items) } |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 build-report/ui-bundle-inventory.json
          $items | Format-Table | Out-String | Write-Host
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: openv-win-client-build-report
          path: build-report/
          if-no-files-found: warn
      - name: Upload experimental client binaries
        if: steps.build.outcome == 'success' && steps.ui.outcome == 'success' && steps.runtime_audit.outcome == 'success' && steps.stage_audit.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: openv-win-client-experimental
          path: code/bin/five/release/
          if-no-files-found: error
          retention-days: 7
      - name: Enforce build result
        if: steps.build.outcome != 'success' || steps.ui.outcome != 'success' || steps.msvc.outcome != 'success' || steps.runtime_audit.outcome != 'success' || steps.stage.outcome != 'success' || steps.stage_audit.outcome != 'success'
        run: throw 'OpenV Windows build, source-built UI, static dependency audit, or byte-for-byte staged runtime verification failed. Download build-report and inspect diagnostics.'
