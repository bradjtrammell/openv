name: OpenV Windows client build (experimental)
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/openv-windows-client.yml'
      - 'tools/openv-gaming-pc-preflight.ps1'
concurrency:
  group: openv-windows-client-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  client:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1
      - name: Initialize required submodules with progress
        shell: bash
        timeout-minutes: 75
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git config --global core.longpaths true
          git config --global submodule.fetchJobs 8
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth 1 --jobs 8 --progress
          git submodule status --recursive > submodule-status.txt
      - name: Prepare toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Windows toolchain inventory'
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'Visual Studio discovery tool not found' }
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\\**\\Bin\\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'Visual Studio MSBuild workload not found' }
          Write-Host "MSBuild: $msbuild"
          where.exe node
          where.exe python
          where.exe git
          where.exe bash
          if (-not (Test-Path 'C:\msys64')) { throw 'MSYS2 required at C:\msys64 (see docs/building.md)' }
          if (-not (Get-Command yarn -ErrorAction SilentlyContinue)) { corepack enable; corepack prepare yarn@1.22.22 --activate }
      - name: Install Python build prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade 'setuptools>=70,<82' wheel
          python -c "import distutils; print('distutils available:', distutils.__file__)"
      - name: Select installed Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          if (-not (Test-Path $sdkRoot)) { throw 'Windows SDK include directory unavailable' }
          $sdk = Get-ChildItem $sdkRoot -Directory |
            Where-Object { (Test-Path (Join-Path $_.FullName 'um\Windows.h')) -and ($_.Name -match '^10[.]0[.][0-9]+[.]0$') } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $sdk) { throw 'No usable Windows SDK found' }
          "WINDOWS_SDK_VERSION=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using Windows SDK: $($sdk.Name)"
      - name: Build client using documented toolchain
        id: build
        continue-on-error: true
        shell: bash
        env:
          PROGRAM: five
        run: |
          set -euo pipefail
          pwsh ./fxd.ps1 get-chrome
          ./prebuild.cmd
          pwsh ./fxd.ps1 gen -game five
          MSBUILD="/c/Program Files/Microsoft Visual Studio/2022/Enterprise/MSBuild/Current/Bin/MSBuild.exe"
          [[ -f "$MSBUILD" ]] || MSBUILD="/c/Program Files/Microsoft Visual Studio/2022/Community/MSBuild/Current/Bin/MSBuild.exe"
          [[ -f "$MSBUILD" ]] || { echo "Could not locate MSBuild"; exit 1; }
          cd code/build/five
          "$MSBUILD" CitizenMP.sln -t:build -restore -p:RestorePackagesConfig=true -p:preferredtoolarchitecture=x64 -p:configuration=release -p:WindowsTargetPlatformVersion=$WINDOWS_SDK_VERSION -maxcpucount:4 -v:minimal -fl1 '-flp1:logfile=client-msbuild.log;verbosity=diagnostic'
      - name: Collect build files and provenance
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path build-report | Out-Null
          git rev-parse HEAD | Set-Content build-report/commit.txt
          Copy-Item submodule-status.txt build-report/submodule-status.txt -ErrorAction SilentlyContinue
          Get-ChildItem -Path code/bin/five -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object FullName,Length | Export-Csv build-report/files.csv -NoTypeInformation
          Copy-Item code/build/five/client-msbuild.log build-report/client-msbuild.log -ErrorAction SilentlyContinue
          Get-ChildItem -Path code/bin/five/release -ErrorAction SilentlyContinue |
            Out-String | Set-Content build-report/release-directory.txt
      - name: Inventory experimental package
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'code/bin/five/release'
          if (-not (Test-Path $root)) {
            '{"status":"missing_release_directory"}' | Set-Content build-report/package-manifest.json
            exit 0
          }
          $resolved = (Resolve-Path $root).Path
          $files = @(Get-ChildItem $resolved -File -Recurse | ForEach-Object {
            $relative = $_.FullName.Substring($resolved.Length).TrimStart('\','/')
            [pscustomobject]@{
              path = $relative.Replace('\','/')
              bytes = $_.Length
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            }
          })
          $executables = @($files | Where-Object { $_.path -match '(?i)[.]exe$' } | Select-Object -ExpandProperty path)
          $manifest = [pscustomobject]@{
            source_commit = (git rev-parse HEAD)
            artifact_root = $root
            file_count = $files.Count
            total_bytes = ($files | Measure-Object -Property bytes -Sum).Sum
            executables = $executables
            files = $files
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 build-report/package-manifest.json
          Write-Host "Package: $($files.Count) files; $($executables.Count) EXE files"
          $executables | ForEach-Object { Write-Host "Executable: $_" }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: openv-win-client-build-report
          path: build-report/
          if-no-files-found: warn
      - name: Upload experimental client binaries
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: openv-win-client-experimental
          path: code/bin/five/release/
          if-no-files-found: error
          retention-days: 7
      - name: Enforce build result
        if: steps.build.outcome != 'success'
        run: throw 'OpenV Windows client build failed. Download build-report and inspect client-msbuild.log.'
