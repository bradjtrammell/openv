<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; connect-src 'none'">
  <title>OpenV — Joining Server</title>
  <link rel="stylesheet" href="styles.css">
  <script src="code.js" defer></script>
</head>
<body>
  <main aria-labelledby="heading">
    <div class="brand">OPEN<span>V</span></div>
    <p class="eyebrow">MULTIPLAYER</p>
    <h1 id="heading">Connecting to your world</h1>
    <p id="status" role="status" aria-live="polite">Preparing your session…</p>
    <div class="progress" role="progressbar" aria-label="Connection progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div>
    <p id="percent">0%</p>
  </main>
</body>
</html>
